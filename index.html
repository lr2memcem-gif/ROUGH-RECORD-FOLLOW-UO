<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Book System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @page { 
      size: A4 portrait; 
      margin: 8mm; 
    }
    @media print {
      body { 
        margin: 0; 
        padding: 0; 
        background: #fff; 
      }
      .no-print { 
        display: none !important; 
      }
      .a4-page {
        border: none !important;
        box-shadow: none !important;
        width: 100% !important;
        height: 280mm !important;
        page-break-after: always !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
      .a4-page:last-child { 
        page-break-after: avoid !important; 
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 font-sans">

  <!-- Top Navigation Header -->
  <header class="no-print bg-slate-900 text-white p-4 shadow">
    <div class="max-w-4xl mx-auto flex flex-wrap justify-between items-center gap-2">
      <h1 class="font-bold text-lg">College Register Portal</h1>
      <div class="flex items-center gap-2">
        <button onclick="showTab('mark')" class="bg-blue-600 hover:bg-blue-700 px-3 py-1.5 rounded text-xs font-semibold">Mark Attendance</button>
        <button onclick="showTab('register')" class="bg-emerald-600 hover:bg-emerald-700 px-3 py-1.5 rounded text-xs font-semibold">Register Book</button>
        <a href="admin.html" class="bg-amber-600 hover:bg-amber-700 px-3 py-1.5 rounded text-xs font-semibold inline-block">Admin Panel</a>
        <button onclick="handleLogout()" class="bg-rose-600 hover:bg-rose-700 px-3 py-1.5 rounded text-xs font-semibold">Logout</button>
      </div>
    </div>
  </header>

  <!-- TAB 1: MARK ATTENDANCE (STAFF / HOD) -->
  <main id="tab-mark" class="no-print max-w-xl mx-auto p-4 mt-2">
    <div class="bg-white p-5 rounded-lg shadow border border-slate-200">
      <h2 class="text-base font-bold border-b pb-2 mb-4 text-slate-800">Mark Period Attendance</h2>
      
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-600">Select Class</label>
          <select id="mark-class" class="w-full border p-2 rounded text-sm mt-1" onchange="onClassChange()">
            <option value="">-- Choose Class --</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600">Date</label>
            <input type="date" id="mark-date" class="w-full border p-2 rounded text-sm mt-1">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600">Hour / Period</label>
            <select id="mark-period" class="w-full border p-2 rounded text-sm mt-1">
              <option value="1">Hour I</option>
              <option value="2">Hour II</option>
              <option value="3">Hour III</option>
              <option value="4">Hour IV</option>
              <option value="5">Hour V</option>
              <option value="6">Hour VI</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-600">Teacher Name</label>
            <input type="text" id="mark-teacher" placeholder="e.g. Maneesh T" class="w-full border p-2 rounded text-sm mt-1">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600">Subject</label>
            <select id="mark-subject" class="w-full border p-2 rounded text-sm mt-1">
              <option value="">-- Select Subject --</option>
            </select>
          </div>
        </div>

        <!-- QUICK ROLL NO ENTRY -->
        <div class="pt-2 border-t">
          <label class="block text-xs font-bold text-slate-700 mb-1">Quick Absentee Entry (Roll Numbers):</label>
          <div class="flex gap-2">
            <input type="text" id="quick-roll-input" placeholder="e.g. 1, 34, 56, 72" class="flex-1 border p-2 rounded text-xs outline-none focus:ring-1 focus:ring-blue-500 font-mono" onkeydown="handleQuickRollKey(event)">
            <button type="button" onclick="applyQuickRolls()" class="bg-slate-800 text-white px-3 py-1.5 rounded text-xs font-bold hover:bg-slate-700">Apply</button>
          </div>
          <p class="text-[10px] text-slate-500 mt-1">Type roll numbers separated by commas and press <b>Enter</b></p>
        </div>

        <div class="pt-2">
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs font-bold text-slate-700">Student Roster:</label>
            <span id="absent-count-badge" class="text-xs font-bold text-rose-600">0 Absent</span>
          </div>
          <div id="student-grid" class="grid grid-cols-2 gap-2 max-h-64 overflow-y-auto p-1 border rounded bg-slate-50">
            <p class="text-xs text-slate-400 col-span-2 p-3 text-center">Select a class above to load students</p>
          </div>
        </div>

        <button onclick="submitAttendance()" id="btn-submit" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded text-sm mt-4 hover:bg-blue-700">
          Save Attendance
        </button>
      </div>
    </div>
  </main>

  <!-- TAB 2: REGISTER BOOK (DATE RANGE GENERATOR) -->
  <main id="tab-register" class="hidden">
    <div class="no-print max-w-4xl mx-auto p-4">
      <div class="bg-white p-4 rounded-lg shadow border border-slate-200 flex flex-wrap gap-3 items-end">
        <div>
          <label class="block text-xs font-bold text-slate-600">Class</label>
          <select id="reg-class" class="border p-2 rounded text-sm min-w-[140px]"></select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600">From Date</label>
          <input type="date" id="reg-from" class="border p-2 rounded text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600">To Date</label>
          <input type="date" id="reg-to" class="border p-2 rounded text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600">Start Page #</label>
          <input type="number" id="reg-page-start" value="1" class="border p-2 rounded text-sm w-16 text-center">
        </div>
        <button onclick="generateBook()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-semibold">Generate</button>
        <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded text-sm font-semibold ml-auto">Print / Save PDF</button>
      </div>
    </div>

    <!-- Container where dynamically generated A4 pages will mount -->
    <div id="pages-container" class="flex flex-col items-center p-4"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
